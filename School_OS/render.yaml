services:
  - type: web
    name: school-os
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && VITE_API_URL=/api/v1 npx vite build && cd ..
      cd backend && pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-os-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: postgres
    name: school-os-db
    plan: free
    database: school_os
